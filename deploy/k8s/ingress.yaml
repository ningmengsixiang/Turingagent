apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ta-ingress
  namespace: ta-prod
spec:
  rules:
    - host: REPLACE_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
