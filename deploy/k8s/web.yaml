apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ta-prod
spec:
  selector:
    app: ta-web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ta-web
  namespace: ta-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ta-web
  template:
    metadata:
      labels:
        app: ta-web
    spec:
      containers:
        - name: web
          # 注（计划修正）：${IMAGE_PREFIX} → REPLACE_IMAGE_PREFIX（install.sh sed 替换）
          image: REPLACE_IMAGE_PREFIXweb:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
