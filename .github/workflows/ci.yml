name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ta
          POSTGRES_PASSWORD: ta
          POSTGRES_DB: ta_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ta:ta@localhost:5432/ta_dev
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: taadmin
      MINIO_SECRET_KEY: ta12345678
      MINIO_BUCKET: ta-files

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack (读 packageManager 字段，与本地 pnpm 一致)
        run: corepack enable && corepack prepare pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]") --activate && pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start MinIO (services 不支持 command，手动 docker run server /data)
        run: |
          docker run -d --name ta-minio \
            -e MINIO_ROOT_USER=taadmin \
            -e MINIO_ROOT_PASSWORD=ta12345678 \
            -p 9000:9000 \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if docker exec ta-minio sh -c 'exec 3<>/dev/tcp/localhost/9000 && exec 3>&-' 2>/dev/null; then
              echo "minio ready after ${i}s"
              break
            fi
            sleep 1
          done
          docker exec ta-minio sh -c 'exec 3<>/dev/tcp/localhost/9000 && exec 3>&-'

      - name: Migrate database
        run: pnpm --filter @ta/gateway migrate
        env:
          DATABASE_URL: postgres://ta:ta@localhost:5432/ta_dev

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://ta:ta@localhost:5432/ta_dev

      - name: Silence eval gate (发布门禁)
        run: pnpm --filter @ta/gateway eval:silence

      - name: Build
        run: pnpm build

      - name: Security audit (安全门禁)
        run: pnpm audit --audit-level high

      - name: Check git clean
        run: git diff --exit-code
